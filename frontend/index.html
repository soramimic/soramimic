<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Soramimic | 空耳歌詞メーカー</title>
    <meta name="description" content="歌詞を入力して、単語リストを選ぶだけ。空耳で置き換えた「○○で歌ってみた」風の替え歌を作れます。" />
    <link rel="canonical" href="https://soramimic.com/" />
    <link rel="icon" type="image/png" href="/logo-soramimic-symbol-v4.png" />
    <link rel="apple-touch-icon" href="/logo-soramimic-symbol-v4.png" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:site_name" content="Soramimic" />
    <meta property="og:title" content="Soramimic | 空耳歌詞メーカー" />
    <meta property="og:description" content="歌詞を入力して、単語リストを選ぶだけ。空耳で置き換えた「○○で歌ってみた」風の替え歌を作れます。" />
    <meta property="og:url" content="https://soramimic.com/" />
    <meta property="og:image" content="https://soramimic.com/og-image-v2.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Soramimic 空耳歌詞メーカー。空耳でつくる、替え歌。" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Soramimic | 空耳歌詞メーカー" />
    <meta name="twitter:description" content="歌詞を入力して、単語リストを選ぶだけ。空耳で置き換えた「○○で歌ってみた」風の替え歌を作れます。" />
    <meta name="twitter:image" content="https://soramimic.com/og-image-v2.png" />
    <meta name="twitter:image:alt" content="Soramimic 空耳歌詞メーカー。空耳でつくる、替え歌。" />
    <script>
      // Google Analytics (GA4)。本番ドメインでのみ有効化する
      // (ローカル開発・CI・プレビューの計測混入を防ぐ)
      (function () {
        if (location.hostname !== "soramimic.com") return;
        var s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=G-HY0DQQKKW8";
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };
        gtag("js", new Date());
        gtag("config", "G-HY0DQQKKW8");
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <header class="site-header">
        <a class="brand" href="./"><img class="brand-logo"
          src="/logo-soramimic-horizontal-v3.png" width="1900" height="467" alt=""
          aria-hidden="true" /><span class="visually-hidden">Soramimic</span></a>
        <button id="btn-legacy" class="legacy-link" type="button" title="自作リストをコピーして旧版を別タブで開きます" aria-describedby="legacy-status">旧版を使う</button>
      </header>
      <p id="legacy-status" class="legacy-status" role="status" hidden></p>

      <main>
        <section id="tab-home">
          <section class="generation-card" aria-label="替え歌を生成">
            <div class="field">
              <textarea id="input-text" class="input" rows="7" aria-label="歌詞またはソラミミックの歌詞JSON"
                placeholder="歌詞を行ごとに入力、またはソラミミックの歌詞JSONを貼り付け"></textarea>
              <button id="btn-lyrics-upload" class="btn generation-upload" type="button"
                aria-describedby="lyrics-file-hint" disabled>
                <span id="lyrics-upload-label">＋ 歌詞をアップロード</span>
                <span id="lyrics-upload-file" class="generation-upload-file" hidden>
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" />
                    <path d="M14 2v6h6M8 13h8M8 17h8" />
                  </svg>
                  <span id="lyrics-file-name" class="generation-file-name"><span id="lyrics-file-stem"></span><span id="lyrics-file-extension"></span></span>
                  <span class="generation-file-change">変更</span>
                </span>
              </button>
              <input id="lyrics-file" type="file" hidden
                accept=".txt,.md,.json,text/plain,text/markdown,application/json"
                aria-label="歌詞またはJSONファイル" aria-describedby="lyrics-file-hint" disabled />
              <div class="generation-input-actions">
                <button id="btn-sample-lyrics" class="generation-source-link" type="button"
                  aria-controls="sample-picker" aria-haspopup="dialog" aria-expanded="false" disabled>サンプル歌詞で試す</button>
              </div>
              <span id="lyrics-file-hint" class="visually-hidden">歌詞（TXT・Markdown）／編集データ（JSON）</span>
              <p id="lyrics-file-status" class="midi-status" role="status" hidden></p>
            </div>
            <div class="field generation-wordlist-row">
              <label class="field-label" for="wordlist-trigger">単語リスト</label>
              <div id="wordlist-buttons" class="generation-wordlist"></div>
            </div>
            <details id="generation-advanced" class="generation-advanced">
              <summary>⚙️ 詳細設定</summary>
              <div class="field">
                <div id="wordlist-facets" class="wordlist-facets"></div>
              </div>
              <div id="priority-words" class="field priority-words"></div>
              <div class="field">
                <h3 class="field-label">パラメータ</h3>
                <div id="preset-buttons" class="btn-group-wrap" role="group" aria-label="変換のプリセット"></div>
                <details id="generation-sound" class="param-disclosure">
                  <summary>音の合わせ方</summary>
                  <div id="param-area" class="param-grid"></div>
                </details>
              </div>
              <div class="field">
                <h3 class="field-label">単語重複</h3>
                <div id="duplicate-buttons" class="btn-group">
                  <button class="btn" data-value="true">あり</button>
                  <button class="btn active" data-value="false">なし</button>
                </div>
              </div>
              <div class="field input-source-row">
                <button id="btn-midi-import" class="btn" title="歌詞入りMIDIから歌詞の読みを取り込みます">MIDIから取り込み</button>
                <input id="midi-file" type="file" accept=".mid,.midi,audio/midi" hidden />
              </div>
              <p id="midi-status" class="midi-status" hidden></p>
            </details>
            <div class="convert-row generation-actions">
              <button id="btn-convert" class="btn btn-primary" disabled>読み込み中...</button>
              <button id="btn-cancel" class="btn" hidden>中止</button>
              <span id="progress" class="progress" role="status" hidden>
                <span id="progress-text">0/0</span><span class="spinner"></span>
              </span>
            </div>
            <p id="generation-error" class="generation-error" role="alert" hidden></p>
          </section>
          <details class="generation-output" id="output-field" hidden>
            <summary>過去の生成結果 <span id="history-count"></span></summary>
            <p id="history-status" class="history-status" role="status" hidden></p>
            <div id="current-result" hidden>
              <div class="output-block">
                <div class="output-header">
                  <h2 id="output-heading">出力結果</h2>
                  <button id="btn-copy-result" class="btn output-copy" type="button"
                    aria-label="歌詞をコピー" title="歌詞をコピー" disabled>
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                      <g class="copy-symbol"><rect x="8" y="8" width="12" height="13" rx="2" /><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" /></g>
                      <path class="copy-success-symbol" d="m5 12 4 4L19 6" />
                      <path class="copy-error-symbol" d="M12 5v9m0 4v1" />
                    </svg>
                  </button>
                  <span id="copy-result-status" class="visually-hidden" role="status" aria-live="polite"></span>
                </div>
                <div id="output-text" class="output-text" role="region" aria-labelledby="output-heading" tabindex="0"></div>
              </div>
              <button id="btn-open-editor" class="btn" hidden>編集ツールで開く</button>
            </div>
            <div id="history-list" class="history-list"></div>
          </details>
        </section>


      </main>
      <footer class="site-footer"><a href="about.html">サイトについて</a></footer>

      <template id="history-card-template">
        <article class="history-item">
          <div class="output-header">
            <h3></h3>
            <button class="btn output-copy" type="button" aria-label="歌詞をコピー" title="歌詞をコピー">
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <g class="copy-symbol"><rect x="8" y="8" width="12" height="13" rx="2" /><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3" /></g>
                <path class="copy-success-symbol" d="m5 12 4 4L19 6" />
                <path class="copy-error-symbol" d="M12 5v9m0 4v1" />
              </svg>
            </button>
            <span class="visually-hidden" role="status" aria-live="polite"></span>
          </div>
          <div class="history-body">
            <p class="history-meta"><span class="history-wordlist"></span> · <time></time></p>
            <div class="history-preview"></div>
            <details class="history-full">
              <summary>全文を表示</summary>
              <div class="output-text" role="region" aria-label="出力結果の全文" tabindex="0"></div>
            </details>
            <button class="btn history-edit" type="button">編集ツールで開く</button>
          </div>
        </article>
      </template>

      <dialog id="sample-picker" class="sample-dialog" aria-labelledby="sample-dialog-title">
        <div class="sample-dialog-header">
          <h2 id="sample-dialog-title">サンプル歌詞を選ぶ</h2>
          <button id="sample-close" class="btn" type="button" aria-label="閉じる">×</button>
        </div>
        <div class="sample-choices">
          <button class="btn" type="button" data-path="sample_lyric/furusato.txt" autofocus>ふるさと</button>
          <button class="btn" type="button" data-path="sample_lyric/momotaro.txt">ももたろう</button>
          <button class="btn" type="button" data-path="sample_lyric/akatombo.txt">赤とんぼ</button>
        </div>
        <p id="sample-status" class="midi-status" role="alert" hidden></p>
      </dialog>

      <dialog id="midi-lyrics-dialog">
        <h2>入力欄のテキストを元歌詞として使いますか?</h2>
        <p>
          元歌詞として使うと、MIDIの歌唱行と対応づけて漢字かな交じりの行で取り込みます。
          文節が正しく取れるため、変換の質が上がります。対応づかなかった行は読みカナになります。
        </p>
        <div class="dialog-buttons">
          <button id="midi-lyrics-no" class="btn">読みカナで取り込む</button>
          <button id="midi-lyrics-yes" class="btn btn-primary">元歌詞として使う</button>
        </div>
      </dialog>

      <dialog id="original-dialog">
        <h2 id="original-dialog-title">自作単語リストの保存</h2>
        <label class="custom-wordlist-name">
          <span>リスト名</span>
          <input id="original-name" class="input" type="text" maxlength="100"
            placeholder="例: 歴代レスラー" autocomplete="off" />
        </label>
        <button id="btn-original-file" class="custom-wordlist-dropzone" type="button">
          <svg class="custom-wordlist-dropzone-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14.5v3A2.5 2.5 0 0 0 7.5 20h9a2.5 2.5 0 0 0 2.5-2.5v-3" />
          </svg>
          <span class="custom-wordlist-dropzone-copy">
            <strong class="custom-wordlist-dropzone-desktop">CSV・TXTファイルをここにドロップ</strong>
            <strong class="custom-wordlist-dropzone-mobile">CSV・TXTファイルを選択</strong>
            <span>またはクリックして選択</span>
          </span>
        </button>
        <input id="original-file" type="file" accept=".csv,.txt,text/csv,text/plain" hidden />
        <textarea id="original-text" class="input" rows="16"
          placeholder="#使用する単語とその読みのセットを各行につき一セットずつカンマ(,)区切りで入力してください&#10;#ひとつの単語に複数の読み方を登録可能です&#10;#読み方が一つだけの場合は省略可能です。その場合、システムが自動的に読み方を決定しますが、間違っていることもあります&#10;#半角シャープ(#)でコメントアウトできます&#10;#1行目に列名(id,original,surface,pronunciation)を書けば、その形式のCSVも貼り付けられます"></textarea>
        <p id="original-status" class="custom-wordlist-status" role="status" hidden></p>
        <div class="dialog-buttons custom-wordlist-dialog-buttons">
          <button id="original-delete" class="btn btn-danger" type="button" hidden>削除</button>
          <span class="dialog-button-spacer"></span>
          <button id="original-cancel" class="btn">キャンセル</button>
          <button id="original-register" class="btn btn-primary">保存して使用</button>
        </div>
      </dialog>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
