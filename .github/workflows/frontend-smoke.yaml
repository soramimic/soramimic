name: frontend-smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: チェックアウトするref(未指定ならイベント既定)
        type: string
        required: false
        default: ''

jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: DBキャッシュの上限・LRU・並行構築テスト
        run: node tests/lru-cache.mjs
      - name: UIスモークテスト(ビルド+実ブラウザで変換導線を確認)
        run: npm run test:smoke
      - name: SNS共有メタデータテスト
        run: node tests/metadata.mjs
      - name: 配信アセットの列・サイズ検証
        run: node tests/static-assets.mjs
      - name: 編集ツールE2E(読み修正・差し替え・再生成・undo・コピー)
        run: node tests/editor-smoke.mjs
      - name: 編集画面のレイアウト・キーボード操作
        run: node tests/editor-layout.mjs
      - name: 選択した単語の詳細情報
        run: node tests/editor-word-details.mjs
      - name: 編集画面の逆引き検索・行単位の再生成
        run: node tests/editor-search.mjs
      - name: 編集ツールタッチE2E(タップ伸縮・ドラッグ選択・長押し詳細)
        run: node tests/editor-touch.mjs
      - name: 候補画面の表示範囲とスクロール(Chromium・WebKit)
        run: node tests/editor-panel-viewport.mjs
      - name: 編集ツール単語リストE2E(リスト切替・自作リスト・csvText契約)
        run: node tests/editor-wordlist.mjs
      - name: 単語リスト内の検索と選択
        run: node tests/editor-wordlist-search.mjs
      - name: 編集ツールfiller E2E(未変換チップの表示・候補からの差し替え)
        run: node tests/editor-filler.mjs
      - name: 編集ツール設定モーダルE2E(パラメータ・単語重複・ファセット絞り込み)
        run: node tests/editor-settings.mjs
      - name: 編集ツールセットアップ画面E2E(phrasesだけのシードからブラウザ変換)
        run: node tests/editor-setup.mjs
      - name: 編集ツール曲選択E2E(ホストへの依頼・待機・キャンセル)
        run: node tests/editor-song.mjs
      - name: 編集ツール元歌詞E2E(字幕用の元歌詞・行ごとの対応づけ)
        run: node tests/editor-lyrics.mjs
      - name: 編集ツール埋め込みE2E
        run: node tests/editor-embed.mjs
      - name: 動画との歌詞受け渡しE2E
        run: node tests/app-bridge.mjs
      - name: 動画生成前の歌詞確認E2E
        run: node tests/editor-review.mjs
