# main 宛ての Pull Request を自動で dev へ向け直す。
#
# main は公開中の安定版とし、通常の開発変更は dev に集約する。
# - preview→main のリリースPRは対象外
# - main へ直接入れる緊急修正は、先に `emergency` ラベルを付けてから base を main にする
# base=main のPRを放置すると
# かつては automerge → 本番デプロイまで直行していたため(2026-07 の義務教育
# リスト追加で実例あり)、うっかり main 宛てに作られたPRをここで dev へ付け替える。
#
# - 本当に main へ直接入れたい緊急修正は `emergency` ラベルを付けてから
#   reopen する(このワークフローが素通しにする)。automerge の対象外なので
#   人間が手動でマージし、そのマージ push を deploy.yaml が拾って本番へ出す
# - フォークPRにも効かせるため pull_request_target を使う(PRのコードは
#   checkout しないので安全)
name: retarget-main-pr
on:
  pull_request_target:
    types: [opened, reopened, edited, labeled, unlabeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: retarget-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  retarget:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'emergency') && (github.event.pull_request.head.ref != 'preview' || github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: base を dev に付け替えて通知
        run: |
          gh pr edit "$PR" --repo "$REPO" --base dev
          gh pr comment "$PR" --repo "$REPO" --body "🔀 base を \`main\` から \`dev\` に変更しました。開発PRは dev に集約し、公開可能な変更だけを preview に昇格してから release PR (preview→main) で本番に反映します。本当に main へ直接入れる緊急修正は、先に \`emergency\` ラベルを付けてから base を \`main\` に変更してください。"
