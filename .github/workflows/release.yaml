name: release
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 23 * * 0"
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-pr-{0}', github.event.pull_request.number) || 'release-prepare' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.resolve.outputs.changed }}
      preview_sha: ${{ steps.resolve.outputs.preview_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: 検証する preview SHA を固定
        id: resolve
        run: |
          preview_sha=$(git ls-remote origin refs/heads/preview | awk '{print $1}')
          if [ -z "$preview_sha" ]; then
            echo "preview ブランチが存在しないためスキップします"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags origin "$preview_sha"
          count=$(git rev-list --count "origin/main..$preview_sha")
          echo "preview ($preview_sha) には main にないコミットが ${count} 件"
          echo "preview_sha=$preview_sha" >> "$GITHUB_OUTPUT"
          if [ "$count" -eq 0 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  golden-candidate:
    needs: resolve
    if: ${{ needs.resolve.outputs.changed == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/golden-test.yaml
    with:
      ref: ${{ needs.resolve.outputs.preview_sha }}

  smoke-candidate:
    needs: resolve
    if: ${{ needs.resolve.outputs.changed == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/frontend-smoke.yaml
    with:
      ref: ${{ needs.resolve.outputs.preview_sha }}

  publish-instructions:
    needs: [resolve, golden-candidate, smoke-candidate]
    if: ${{ needs.resolve.outputs.changed == 'true' && needs.golden-candidate.result == 'success' && needs.smoke-candidate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PREVIEW_SHA: ${{ needs.resolve.outputs.preview_sha }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: release PRの案内を表示
        run: |
          current_sha=$(gh api "repos/$REPO/git/ref/heads/preview" --jq '.object.sha')
          {
            echo "## Release candidate の検証完了"
            echo
            echo "- 検証済み preview SHA: \`$PREVIEW_SHA\`"
            echo "- 現在の preview SHA: \`$current_sha\`"
            echo
            if [ "$current_sha" = "$PREVIEW_SHA" ]; then
              echo "[preview → main のPRを作成または確認する](https://github.com/$REPO/compare/main...preview?expand=1)"
              echo
            else
              echo "> preview が検証中に進みました。この結果は \`$PREVIEW_SHA\` だけに対するものです。"
              echo "> Actionsからreleaseを再実行し、現在のpreview SHAを検証してください。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  golden-release-pr-head:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
    uses: ./.github/workflows/golden-test.yaml
    with:
      ref: ${{ github.event.pull_request.head.sha }}

  smoke-release-pr-head:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
    uses: ./.github/workflows/frontend-smoke.yaml
    with:
      ref: ${{ github.event.pull_request.head.sha }}

  reject-fork-main-pr:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: forkからmainへのPRを拒否
        run: |
          echo "forkのhead SHAはrelease gateでは検証しません。PRのbaseをdevに変更してください。" >&2
          exit 1

  validate-main-source:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: previewまたは明示された緊急修正だけを許可
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          IS_EMERGENCY: ${{ contains(github.event.pull_request.labels.*.name, 'emergency') }}
        run: |
          if [ "$HEAD_REPO" = "$REPO" ] && [ "$HEAD_REF" = "preview" ]; then
            exit 0
          fi
          if [ "$IS_EMERGENCY" = "true" ]; then
            exit 0
          fi
          echo "mainへ入れられるのは同一repositoryのpreviewか、明示されたemergency PRだけです" >&2
          exit 1
