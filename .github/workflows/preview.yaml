name: preview
on:
  push:
    branches: [dev, preview]
  workflow_call:
    inputs:
      ref:
        description: チェックアウトするref(未指定ならイベント既定)
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        description: デプロイする常設ブランチ
        required: true
        type: choice
        options: [dev, preview]

concurrency:
  group: preview-${{ inputs.ref || github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Secretの有無を確認(未設定ならスキップ)
        id: guard
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN が未設定のためプレビューをスキップします"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: デプロイ対象を検証
        if: steps.guard.outputs.run == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call')
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          case "$REQUESTED_REF" in
            dev|preview) ;;
            *) echo "手動デプロイはdevまたはpreviewだけを指定できます: $REQUESTED_REF" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'
        with:
          ref: ${{ inputs.ref || '' }}
          submodules: true
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 依存インストール
        if: steps.guard.outputs.run == 'true'
        working-directory: frontend
        run: npm ci
      - name: ビルド(prebuildでkuromoji辞書もpublicへ)
        if: steps.guard.outputs.run == 'true'
        working-directory: frontend
        run: npm run build
      - name: プレビュー用のブランチ別名を決める
        if: steps.guard.outputs.run == 'true'
        id: alias
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          ALIAS="$REQUESTED_REF"
          if [ -z "$ALIAS" ]; then
            RAW="${HEAD_REF:-$REF_NAME}"
            if [ "$RAW" = "dev" ] || [ "$RAW" = "preview" ]; then
              ALIAS="$RAW"
            else
              ALIAS=$(printf '%s' "$RAW" | tr '/_' '--' | tr -cd 'a-zA-Z0-9-' | cut -c1-28)
            fi
          fi
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
      - name: Cloudflare Pages へプレビューデプロイ
        if: steps.guard.outputs.run == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: pages deploy dist --project-name soramimic --branch ${{ steps.alias.outputs.alias }}
      - name: 表示用のプレビューURLを決める
        if: steps.guard.outputs.run == 'true'
        id: url
        run: |
          if [ "${{ steps.alias.outputs.alias }}" = "dev" ] || [ "${{ steps.alias.outputs.alias }}" = "preview" ]; then
            echo "url=https://${{ steps.alias.outputs.alias }}.soramimic.pages.dev" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_OUTPUT"
          fi
      - name: プレビューURLをまとめに出力
        if: steps.guard.outputs.run == 'true'
        run: |
          echo "### プレビュー: ${{ steps.url.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
