# frontend をビルドして Cloudflare Pages のプレビュー環境へデプロイする。
# 本番(main → soramimic.pages.dev)とは別に、dev と preview をそれぞれ固定URLへ出す。
# - dev: 未承認の変更も含む開発・統合確認 (https://dev.soramimic.pages.dev)
# - preview: 次に本番へ出す承認済み候補 (https://preview.soramimic.pages.dev)
#
# 起動経路:
# - automerge が dev へのマージ成功後に workflow_call で呼ぶ(alias=dev 固定)。
#   GITHUB_TOKEN によるマージpushは push トリガーを起動しないため、call で確実に回す
# - dev / preview へ直接pushされたとき(常設ブランチと同名のaliasになる)
# - 手動(workflow_dispatch)
#
# 必要な GitHub Secrets は deploy.yaml と同じ(CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID)。
# 未設定の間はスキップして成功終了する。
name: preview
on:
  push:
    branches: [dev, preview]
  workflow_call:
    inputs:
      ref:
        description: チェックアウトするref(未指定ならイベント既定)
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        description: デプロイする常設ブランチ
        required: true
        type: choice
        options: [dev, preview]

concurrency:
  group: preview-${{ inputs.ref || github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Secretの有無を確認(未設定ならスキップ)
        id: guard
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN が未設定のためプレビューをスキップします"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: デプロイ対象を検証
        if: steps.guard.outputs.run == 'true' && (github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call')
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          case "$REQUESTED_REF" in
            dev|preview) ;;
            *) echo "手動デプロイはdevまたはpreviewだけを指定できます: $REQUESTED_REF" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'
        with:
          # workflow_call で ref が渡されたらそれを使う(automerge からは dev)。
          # 未指定(空)ならイベント既定(PRはマージコミット、pushはそのブランチ)
          ref: ${{ inputs.ref || '' }}
          submodules: true
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.run == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 依存インストール
        if: steps.guard.outputs.run == 'true'
        working-directory: frontend
        run: npm ci
      - name: ビルド(prebuildでkuromoji辞書もpublicへ)
        if: steps.guard.outputs.run == 'true'
        working-directory: frontend
        run: npm run build
      - name: プレビュー用のブランチ別名を決める
        if: steps.guard.outputs.run == 'true'
        id: alias
        env:
          REQUESTED_REF: ${{ inputs.ref }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          ALIAS="$REQUESTED_REF"
          if [ -z "$ALIAS" ]; then
            RAW="${HEAD_REF:-$REF_NAME}"
            if [ "$RAW" = "dev" ] || [ "$RAW" = "preview" ]; then
              # 常設ブランチは同名の固定URLへ出す
              ALIAS="$RAW"
            else
              # Cloudflare のブランチ別名に使える文字へ整形(英数とハイフン、先頭28字)
              ALIAS=$(printf '%s' "$RAW" | tr '/_' '--' | tr -cd 'a-zA-Z0-9-' | cut -c1-28)
            fi
          fi
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
      - name: Cloudflare Pages へプレビューデプロイ
        if: steps.guard.outputs.run == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          # main 以外の --branch を指定するとプレビューデプロイになる
          command: pages deploy dist --project-name soramimic --branch ${{ steps.alias.outputs.alias }}
      - name: 表示用のプレビューURLを決める
        if: steps.guard.outputs.run == 'true'
        id: url
        run: |
          # 常設エイリアス(dev / preview)のときは安定URLを案内する
          if [ "${{ steps.alias.outputs.alias }}" = "dev" ] || [ "${{ steps.alias.outputs.alias }}" = "preview" ]; then
            echo "url=https://${{ steps.alias.outputs.alias }}.soramimic.pages.dev" >> "$GITHUB_OUTPUT"
          else
            echo "url=${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_OUTPUT"
          fi
      - name: プレビューURLをまとめに出力
        if: steps.guard.outputs.run == 'true'
        run: |
          echo "### プレビュー: ${{ steps.url.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
