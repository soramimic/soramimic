name: golden-test
on:
  push:
    branches: [main]
  pull_request:
  # release.yaml がリリース前の dev を再検証するために呼ぶ
  workflow_call:
    inputs:
      ref:
        description: チェックアウトするref(未指定ならイベント既定)
        type: string
        required: false
        default: ''

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: frontend依存のインストール(kuromoji)
        run: npm ci
        working-directory: frontend
      - name: アルゴリズム出力のゴールデンテスト
        run: node tests/golden/run.cjs
      - name: 編集ツール向けAPI(候補取得・固定つき再生成)のテスト
        run: node tests/editor-api.mjs
      - name: 小書きカナ吸収のテスト
        run: node tests/small-kana.mjs
      - name: formatKanaの英字カナ化のテスト
        run: node tests/format-kana.mjs
      - name: ルビ記法(｜表層《よみ》)のテスト
        run: node tests/ruby.mjs
      - name: ユニット位置別の重み付きスコアリングのテスト
        run: node tests/unit-weights.mjs
      - name: 自作リストの正規化CSV(csvText契約・idの決定性)のテスト
        run: node tests/wordlist-csv.mjs
      - name: 名前付き自作リスト保存・旧データ移行のテスト
        run: node tests/custom-wordlists.mjs
      - name: filler(万能候補)のテスト
        run: node tests/filler.mjs
      - name: 出力形式のテスト
        run: node tests/convert-output.mjs
      - name: XF MIDI取り込みのテスト
        run: node tests/xfmidi.mjs
      - name: 元歌詞アライメントのテスト
        run: node tests/xfalign.mjs
