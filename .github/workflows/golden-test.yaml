name: golden-test
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: チェックアウトするref(未指定ならイベント既定)
        type: string
        required: false
        default: ''

jobs:
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: frontend依存のインストール(kuromoji)
        run: npm ci
        working-directory: frontend
      - name: アルゴリズム出力のゴールデンテスト
        run: node tests/golden/run.cjs
      - name: 編集ツール向けAPI(候補取得・固定つき再生成)のテスト
        run: node tests/editor-api.mjs
      - name: 逆引き検索・行単位の再生成のテスト
        run: node tests/editor-placement.mjs
      - name: ン・ッ・ーの編集距離一貫性テスト
        run: node tests/editdist.mjs
      - name: 小書きカナ吸収のテスト
        run: node tests/small-kana.mjs
      - name: トークン境界をまたぐ長音のテスト
        run: node tests/long-vowels.mjs
      - name: 長音の母音展開と省メモリ比較のテスト
        run: node tests/long-vowel-search.mjs
      - name: formatKanaの英字カナ化のテスト
        run: node tests/format-kana.mjs
      - name: ルビ記法(｜表層《よみ》)のテスト
        run: node tests/ruby.mjs
      - name: ユニット位置別の重み付きスコアリングのテスト
        run: node tests/unit-weights.mjs
      - name: 近似候補検索と正確検索の一致テスト
        run: node tests/approximate-search.mjs
      - name: 重複なし生成のstreaming exact検索テスト
        run: node tests/streaming-exact.mjs
      - name: 優先単語の選択・生成テスト
        run: node tests/priority-words.mjs
      - name: 優先単語の先行配置テスト
        run: node tests/priority-placement.mjs
      - name: 音節バリエーション早期枝刈りのテスト
        run: node tests/variation-pruning.mjs
      - name: 発音候補の省メモリ検索と列挙結果の一致テスト
        run: node tests/compact-search.mjs
      - name: 自作リストの正規化CSV(csvText契約・idの決定性)のテスト
        run: node tests/wordlist-csv.mjs
      - name: 名前付き自作リスト保存・旧データ移行のテスト
        run: node tests/custom-wordlists.mjs
      - name: 自作リストCSV・テキストファイル読み込みのテスト
        run: node tests/custom-wordlist-file.mjs
      - name: filler(万能候補)のテスト
        run: node tests/filler.mjs
      - name: 出力形式のテスト
        run: node tests/convert-output.mjs
      - name: XF MIDI取り込みのテスト
        run: node tests/xfmidi.mjs
      - name: 元歌詞アライメントのテスト
        run: node tests/xfalign.mjs
      - name: 単語リスト設定のテスト
        run: node tests/setting-wordlists.mjs
      - name: dev・preview・main昇格ポリシーのテスト
        run: node tests/branch-promotion-policy.mjs
      - name: Markdown-only PR policy tests
        run: node tests/main-pr-policy.cjs
      - name: 性能劣化の判定ロジック
        run: node tests/performance/compare.test.mjs
      - name: 性能比較用の変更前コード
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .performance-base
          persist-credentials: false
      - name: 変更前コードの依存インストール
        if: github.event_name == 'pull_request'
        run: npm ci
        working-directory: .performance-base/frontend
      - name: 変更前後の生成時間・CPU時間の比較
        if: github.event_name == 'pull_request'
        timeout-minutes: 10
        run: node tests/performance/run.mjs --base .performance-base --report performance-results.json
      - name: 性能比較レポート
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: generation-performance
          path: performance-results.json
          if-no-files-found: ignore
