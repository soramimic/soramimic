name: automerge
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited, labeled, unlabeled]
    branches: [dev, preview, main]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    if: >-
      ${{
        !github.event.pull_request.draft &&
        !contains(github.event.pull_request.labels.*.name, 'no-automerge') &&
        !contains(github.event.pull_request.labels.*.name, 'emergency') &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          github.event.pull_request.base.ref == 'dev' ||
          github.event.pull_request.base.ref == 'preview' ||
          (
            github.event.pull_request.base.ref == 'main' &&
            github.event.pull_request.head.ref == 'preview'
          )
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      BASE: ${{ github.event.pull_request.base.ref }}
      REPO: ${{ github.repository }}
    steps:
      - name: 他のチェックの完了を待って自動マージ
        id: merge
        run: |
          echo "PR #$PR ($SHA) のチェック完了を待機します"
          for i in $(seq 1 50); do
            sleep 20
            runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
              -q '[.check_runs[] | select(.name != "automerge")]')
            total=$(echo "$runs" | jq 'length')
            incomplete=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
            failed=$(echo "$runs" | jq '[.[] | select(.status == "completed"
              and .conclusion != "success" and .conclusion != "neutral"
              and .conclusion != "skipped")] | length')
            required_ready=$(echo "$runs" | jq '["golden", "smoke"] as $required
              | [$required[] as $name | any(.[]; .name == $name and .status == "completed"
                and (.conclusion == "success" or .conclusion == "neutral" or .conclusion == "skipped"))]
              | map(select(.)) | length')
            echo "checks: total=$total incomplete=$incomplete failed=$failed required_ready=$required_ready/2"
            if [ "$failed" -gt 0 ]; then
              echo "$runs" | jq -r '.[] | select(.conclusion != null) | "\(.name): \(.conclusion)"'
              echo "失敗したチェックがあるためマージしません"
              exit 0
            fi
            if [ "$total" -gt 0 ] && [ "$incomplete" -eq 0 ] && [ "$required_ready" -eq 2 ]; then
              live=$(gh api "repos/$REPO/pulls/$PR")
              live_state=$(echo "$live" | jq -r '.state')
              live_draft=$(echo "$live" | jq -r '.draft')
              live_base=$(echo "$live" | jq -r '.base.ref')
              live_branch=$(echo "$live" | jq -r '.head.ref')
              live_repo=$(echo "$live" | jq -r '.head.repo.full_name')
              live_sha=$(echo "$live" | jq -r '.head.sha')
              stopped=$(echo "$live" | jq '[.labels[].name | select(. == "no-automerge" or . == "emergency")] | length')
              if [ "$live_state" != "open" ] || [ "$live_draft" != "false" ] || \
                 [ "$live_repo" != "$REPO" ] || [ "$live_sha" != "$SHA" ] || \
                 [ "$live_base" != "$BASE" ] || [ "$live_branch" != "$BRANCH" ] || \
                 [ "$stopped" -ne 0 ]; then
                echo "PRの状態が待機開始時から変わったためマージしません" >&2
                exit 1
              fi
              if [ "$BASE" = "main" ] && [ "$BRANCH" != "preview" ]; then
                echo "mainへ自動マージできるのはpreviewだけです" >&2
                exit 1
              fi
              echo "全チェック成功。マージします"
              result=''
              for attempt in 1 2 3; do
                if result=$(gh api -X PUT "repos/$REPO/pulls/$PR/merge" \
                  -f merge_method=merge -f sha="$SHA"); then
                  break
                fi
                after_error=$(gh api "repos/$REPO/pulls/$PR" 2>/dev/null || true)
                if [ "$(echo "$after_error" | jq -r '.merged_at // empty')" != "" ]; then
                  result='{"merged":true}'
                  break
                fi
                echo "マージAPIが失敗しました（$attempt/3）。再試行します" >&2
                sleep 10
              done
              if [ "$(echo "$result" | jq -r '.merged')" != "true" ]; then
                echo "$result" | jq -r '.message // "マージできませんでした"' >&2
                exit 1
              fi
              if [ "$BRANCH" != "dev" ] && [ "$BRANCH" != "preview" ]; then
                gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" || true
              fi
              echo "merged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "タイムアウト: チェックが完了しませんでした" >&2
          exit 1

  deploy-dev:
    needs: automerge
    if: ${{ needs.automerge.outputs.merged == 'true' && github.event.pull_request.base.ref == 'dev' }}
    uses: ./.github/workflows/preview.yaml
    with:
      ref: dev
    secrets: inherit

  deploy-preview:
    needs: automerge
    if: ${{ needs.automerge.outputs.merged == 'true' && github.event.pull_request.base.ref == 'preview' }}
    uses: ./.github/workflows/preview.yaml
    with:
      ref: preview
    secrets: inherit

  deploy-main:
    needs: automerge
    if: ${{ needs.automerge.outputs.merged == 'true' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'preview' }}
    uses: ./.github/workflows/deploy.yaml
    secrets: inherit
