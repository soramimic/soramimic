# dev 向けPRの自動マージ。CI(golden / smoke など、このPRに付く全チェック)が
# すべて成功したら、確認したコミットSHAを指定してマージする。
# - 開発PRは base=dev。マージ後は preview.soramimic.pages.dev を更新する
# - main 向けPRは自動マージの対象外(retarget-main-pr.yaml が dev へ自動で向け直す)。
#   emergency ラベル付きの緊急修正だけが main 宛てのまま残り、人間が手動でマージする。
#   人間による手動マージの push は deploy.yaml の push トリガーで本番デプロイされる
# - 除外したいPRには `no-automerge` ラベルを付ける(ドラフトPRも対象外)
# - 新しいpushが来ると古い待機はキャンセルされ、新SHAで待機し直す
# - privateリポジトリ+FreeプランではGitHub標準のauto-merge機能が使えないための自作
name: automerge
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
    branches: [dev]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    # フォークからのPRは対象外(公開リポジトリでは外部PRを人間レビューなしで
    # マージしない。そもそもフォークPRのGITHUB_TOKENはread-onlyでマージ不可)
    if: ${{ !github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'no-automerge') && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      REPO: ${{ github.repository }}
    steps:
      - name: 他のチェックの完了を待って自動マージ
        id: merge
        run: |
          echo "PR #$PR ($SHA) のチェック完了を待機します"
          for i in $(seq 1 50); do
            sleep 20
            runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100" \
              -q '[.check_runs[] | select(.name != "automerge")]')
            total=$(echo "$runs" | jq 'length')
            incomplete=$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')
            failed=$(echo "$runs" | jq '[.[] | select(.status == "completed"
              and .conclusion != "success" and .conclusion != "neutral"
              and .conclusion != "skipped")] | length')
            echo "checks: total=$total incomplete=$incomplete failed=$failed"
            if [ "$failed" -gt 0 ]; then
              echo "$runs" | jq -r '.[] | select(.conclusion != null) | "\(.name): \(.conclusion)"'
              echo "失敗したチェックがあるためマージしません"
              exit 0
            fi
            if [ "$total" -gt 0 ] && [ "$incomplete" -eq 0 ]; then
              echo "全チェック成功。マージします"
              gh api -X PUT "repos/$REPO/pulls/$PR/merge" \
                -f merge_method=merge -f sha="$SHA"
              # dev はリリース待ちの常設ブランチなので削除しない(dev→main の手動PR対策)
              if [ "$BRANCH" != "dev" ]; then
                gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" || true
              fi
              # 後続の deploy ジョブを起動するためのフラグ
              echo "merged=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "タイムアウト: チェックが完了しませんでした" >&2
          exit 1

  # マージ成功時の後続処理(GITHUB_TOKEN によるマージpushは push トリガーを
  # 起動しないため、workflow_call で確実に回す)
  preview:
    needs: automerge
    if: ${{ needs.automerge.outputs.merged == 'true' && github.event.pull_request.base.ref == 'dev' }}
    uses: ./.github/workflows/preview.yaml
    with:
      ref: dev
      alias: preview
    secrets: inherit
